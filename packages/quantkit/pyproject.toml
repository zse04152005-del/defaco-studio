[project]
name = "quantkit"
version = "0.1.0"
description = "DeFaCo Studio engine: A-share data pipeline, characteristics, risk models, optimizers and backtesting."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4",
  "duckdb>=1.0", "pyarrow>=15", "cvxpy>=1.5", "pyyaml>=6", "pydantic>=2",
  "akshare>=1.14", "baostock>=0.8.9", "arch>=6.2", "bottleneck>=1.3", "requests>=2.31", "certifi",
]
[project.optional-dependencies]
dev = ["pytest>=8"]
dl = ["torch>=2.2"]          # optional: autoencoder factor extractors (AEN / DAE)
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
artifacts = ["src/quantkit/data/certs/*.pem"]
packages = ["src/quantkit"]
[tool.pytest.ini_options]
testpaths = ["tests"]
